<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jelajah">
  <title>Jelajah</title>
  <circle cx="32" cy="32" r="31" fill="#f5eedf"/>
  <g transform="rotate(-10 32 32)" fill="none" stroke="#b3261e" stroke-linecap="round">
    <!-- the rubber-stamp rim, ticked like an eki stamp -->
    <circle cx="32" cy="32" r="27.5" stroke-width="3.5"/>
    <circle cx="32" cy="32" r="22.5" stroke-width="1.6" stroke-dasharray="0.1 4.2"/>
    <!-- J: the route walked from stall to stall -->
    <path d="M37 16v18.5a9 9 0 0 1-17.2 3.7" stroke-width="6.5"/>
    <!-- the stall you're heading to -->
    <circle cx="37" cy="16" r="4.6" fill="#b7791f" stroke="#f5eedf" stroke-width="1.4"/>
  </g>
</svg>
